plugins {
	id 'java'
}

repositories {
	mavenLocal()
	maven {
		url = 'https://repo.runelite.net'
		content {
			includeGroupByRegex("net\\.runelite.*")
		}
	}
	mavenCentral()
}

def runeLiteVersion = 'latest.release'
def pluginMainClass = 'com.petbattles.PetBattlesPluginTest'

dependencies {
	compileOnly group: 'net.runelite', name:'client', version: runeLiteVersion

	compileOnly 'org.projectlombok:lombok:1.18.30'
	annotationProcessor 'org.projectlombok:lombok:1.18.30'

	testImplementation 'junit:junit:4.12'
	testImplementation group: 'net.runelite', name:'client', version: runeLiteVersion
	testImplementation group: 'net.runelite', name:'jshell', version: runeLiteVersion
}

group = 'com.petbattles'

tasks.withType(JavaCompile).configureEach {
	options.encoding = 'UTF-8'
	options.release.set(11)
}

tasks.register('run', JavaExec) {
	classpath = sourceSets.test.runtimeClasspath
	mainClass = pluginMainClass

	jvmArgs "-ea"
	args "--developer-mode", "--debug"

	// Enable Pet Battles developer mode with `./gradlew run -Pdev` (see PetBattlesConfig.DEV).
	// The forked JVM doesn't inherit gradle's system properties, so forward them here. Extra dev
	// knobs pass through too, e.g. `-Pdev -Ppetbattles.xpMult=50`.
	if (project.hasProperty('dev')) {
		jvmArgs "-Dpetbattles.dev=true"
	}
	['unlockAll', 'fullXpCurve', 'trace', 'xpMult'].each { k ->
		if (project.hasProperty("petbattles.$k")) {
			jvmArgs "-Dpetbattles.$k=${project.property("petbattles.$k")}"
		}
	}
}

// Build-time QA/reference page: every pet, its learnset, and the type chart.
// Lives in the test source set so it never touches the shipped plugin jar;
// output goes to build/ only (gitignored).
tasks.register('generatePetReference', JavaExec) {
	group = 'documentation'
	description = 'Generate build/pets.html from the bundled species/move/typechart JSON'
	classpath = sourceSets.test.runtimeClasspath
	mainClass = 'com.petbattles.tools.PetReferenceGenerator'
	args layout.buildDirectory.file('pets.html').get().asFile.path
}

// Build-time QA tool: renders every move's attack animation to a looping GIF plus an HTML
// contact sheet, so animations can be reviewed outside the game client. Output goes to
// build/animations/ only (gitignored); not wired into `build` since it's an on-demand aid.
tasks.register('previewAnimations', JavaExec) {
	group = 'documentation'
	description = 'Render every move animation to build/animations/*.gif + index.html'
	classpath = sourceSets.test.runtimeClasspath
	mainClass = 'com.petbattles.tools.AnimationPreviewGenerator'
	args layout.buildDirectory.dir('animations').get().asFile.path
}

// Build-time QA tool: composites every chathead with every cosmetic using the real anchor
// placement, so hats and glasses can be checked without levelling pets in-game. Output goes to
// build/cosmetics/ only (gitignored); on-demand, like previewAnimations.
tasks.register('previewCosmetics', JavaExec) {
	group = 'documentation'
	description = 'Render every chathead + cosmetic composite to build/cosmetics/*.png + index.html'
	classpath = sourceSets.test.runtimeClasspath
	mainClass = 'com.petbattles.tools.CosmeticPreviewGenerator'
	args layout.buildDirectory.dir('cosmetics').get().asFile.path
}

tasks.named('build') {
	dependsOn 'generatePetReference'
}

tasks.register('shadowJar', Jar) {
	dependsOn configurations.testRuntimeClasspath
	manifest {
		attributes('Main-Class': pluginMainClass, 'Multi-Release': true)
	}

	duplicatesStrategy = DuplicatesStrategy.EXCLUDE
	from sourceSets.main.output
	from sourceSets.test.output
	from {
		configurations.testRuntimeClasspath.collect { file ->
			file.isDirectory() ? file : zipTree(file)
		}
	}

	exclude 'META-INF/INDEX.LIST'
	exclude 'META-INF/*.SF'
	exclude 'META-INF/*.DSA'
	exclude 'META-INF/*.RSA'
	exclude '**/module-info.class'

	group = BasePlugin.BUILD_GROUP
	archiveClassifier.set('shadow')
	archiveFileName.set("${rootProject.name}-${project.version}-all.jar")
}
